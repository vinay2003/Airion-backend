name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  quality-assurance:
    name: 🏗️ Quality Assurance
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: 🟢 Setup Node.js v20
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: 📦 Install Ecosystem
      run: npm ci

    - name: 🔍 Linter Audit
      run: npm run lint

    - name: 🧪 Unit Testing Suite
      run: npm run test
      continue-on-error: true # Allow pipeline to continue for now until tests are fully written

    - name: 🏗️ Parallel Build (Turbo)
      run: npx turbo run build
      env:
        NODE_ENV: production
        TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
        TURBO_TEAM: ${{ secrets.TURBO_TEAM }}

    - name: 🛡️ Security Audit
      run: npm audit --audit-level=high
      continue-on-error: true

  deployment:
    name: 🚀 Production Synchronization
    needs: quality-assurance
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Snapshot Artifact
        run: echo "Finalizing build artifact deployment..."
