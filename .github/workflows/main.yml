name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm install

    - name: Build Backend
      run: npm run backend:build

    - name: Build Frontend (User Website)
      run: npm run build --prefix frontend/user-website

    - name: Lint
      run: npm run lint || true # Allow lint failure for now during refactoring
