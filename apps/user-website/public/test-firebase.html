<!DOCTYPE html>
<html>
<head>
  <title>Firebase Phone Auth Test</title>
  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
    import { getAuth, RecaptchaVerifier, signInWithPhoneNumber } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';

    const firebaseConfig = {
      apiKey: "AIzaSyAigoCAh80p9Qey4JfpDpztAj8RLjCB8mQ",
      authDomain: "easy2event-67c2a.firebaseapp.com",
      projectId: "easy2event-67c2a",
      storageBucket: "easy2event-67c2a.firebasestorage.app",
      messagingSenderId: "742753803631",
      appId: "1:742753803631:web:531861dffbdf90e44c5c9a"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    window.onload = () => {
      window.recaptchaVerifier = new RecaptchaVerifier(auth, 'recaptcha-container', {
        'size': 'normal',
        'callback': (response) => {
          document.getElementById('status').innerText = 'reCAPTCHA solved!';
        },
        'expired-callback': () => {
          document.getElementById('status').innerText = 'reCAPTCHA expired.';
        }
      });
      window.recaptchaVerifier.render();
    };

    window.sendOTP = () => {
      const phone = document.getElementById('phone').value;
      document.getElementById('status').innerText = 'Sending OTP...';
      signInWithPhoneNumber(auth, phone, window.recaptchaVerifier)
        .then((confirmationResult) => {
          window.confirmationResult = confirmationResult;
          document.getElementById('status').innerText = 'OTP sent! Check your phone.';
          document.getElementById('otp-section').style.display = 'block';
        }).catch((error) => {
          document.getElementById('status').innerText = 'Error: ' + error.message;
        });
    };

    window.verifyOTP = () => {
      const code = document.getElementById('otp').value;
      confirmationResult.confirm(code).then((result) => {
        document.getElementById('status').innerText = 'User verified: ' + result.user.uid;
      }).catch((error) => {
        document.getElementById('status').innerText = 'Error: ' + error.message;
      });
    };
  </script>
</head>
<body style="font-family: sans-serif; padding: 20px;">
  <h2>Firebase Phone Auth Test</h2>
  <div id="recaptcha-container"></div>
  <br>
  <input type="text" id="phone" placeholder="+919876543210" value="+91">
  <button onclick="sendOTP()">Send OTP</button>
  <div id="otp-section" style="display:none; margin-top: 20px;">
    <input type="text" id="otp" placeholder="123456">
    <button onclick="verifyOTP()">Verify OTP</button>
  </div>
  <p id="status" style="color: red; font-weight: bold;"></p>
</body>
</html>
